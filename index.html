<input id="login-password" name="password" type="password" minlength="6" required autocomplete="current-password" style="display:block;width:100%;padding:13px;border:1px solid #aebdd0;border-radius:10px;font:inherit;margin:10px 0">
<button id="password-toggle" class="password-toggle" type="button" aria-label="Parādīt paroli" aria-pressed="false" title="Parādīt paroli">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<p id="login-message" role="status" aria-live="polite"></p>
<button type="submit">Pieslēgties</button>

</form>
</section>
<section id="school" hidden aria-live="polite">
<span class="tag">Mājas skola</span><h1 id="school-title"></h1><p id="school-intro"></p>
<div class="modules" id="modules"></div>
<p><button class="back" id="back" type="button">← Atpakaļ uz sākumu</button></p>
</section>
<footer>Mājas skola ar Firebase integrāciju · Projekts: <code>datorika-hub</code> · Dati izolēti <code>homeSchool</code> struktūrā</footer>
</main>
<script>
(function(){
  const input=document.getElementById('login-password');
  const toggle=document.getElementById('password-toggle');
  const eye='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff='<path d="M3 3l18 18M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.2 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/>';
  toggle.addEventListener('click',function(){
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    toggle.setAttribute('aria-label',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('title',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('aria-pressed',String(visible));
    toggle.querySelector('svg').innerHTML=visible?eyeOff:eye;
    input.focus({preventScroll:true});
  });
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(err){
      console.warn('[PWA] SW reģistrācija:', err);
    });
  });
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('pwa-install-btn');
  if (btn) {
    btn.hidden = false;
    btn.onclick = async function() {
      btn.hidden = true;
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    };
  }
});
</script>
<script type="module" src="/public/bundle.js"></script>
</body></html>

<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13273e">
<title>Mājas skola</title>
<meta name="description" content="Mājas skola — Marka, Samantas un vecāku vide.">
<meta property="og:title" content="Mājas skola">
<meta property="og:description" content="Mājas skola - demonstrācijas skati: Marka skola, Samantas skola un Vecāka panelis.">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#15243a;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#14283e;color:white;padding:18px max(20px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header button{background:transparent;color:#fff;border:1px solid #708296;padding:10px;border-radius:9px;cursor:pointer}.wrap{max-width:960px;margin:56px auto;padding:0 20px}h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 12px}p{line-height:1.6;color:#52637a}.intro{max-width:640px;margin-bottom:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:white;border:1px solid #dbe4ef;border-radius:19px;padding:27px;box-shadow:0 9px 28px #18324d0b}.symbol{font-size:38px}.card h2{margin:14px 0 8px}.card button,.back{background:#215cba;color:#fff;border:0;padding:12px 16px;border-radius:11px;font:inherit;font-weight:650;cursor:pointer}.card button{margin-top:10px}.card button:hover,.back:hover{background:#19498f}.tag{display:inline-block;border-radius:99px;background:#eaf1fa;color:#315987;padding:5px 10px;font-size:.85rem}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:28px}.module{border:1px solid #dbe4ef;background:#fff;border-radius:14px;padding:20px}.module p{margin-bottom:0}footer{margin:44px 0;color:#64748b;font-size:.9rem}button:focus-visible{outline:3px solid #f9b83d;outline-offset:3px}[hidden]{display:none!important}
.password-field{position:relative;margin:10px 0}.password-field input{margin:0!important;padding-right:56px!important}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:transparent!important;color:#52637a!important;border:0!important;border-radius:9px;cursor:pointer;margin:0!important;padding:0!important}.password-toggle:hover{background:#eaf1fa!important}.password-toggle svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card input:focus{outline:2px solid #215cba;outline-offset:2px}.card button:disabled{opacity:.55;cursor:wait}</style>
</head>
<body>
<header><strong>🏠 Mājas skola</strong><button id="home" type="button" hidden>← Sākums</button></header>
<main class="wrap">
<section id="welcome">
<h1>🏠 Mājas skola</h1>
<p class="intro">Ievadi savu paroli — atvērsies Marka, Samantas vai vecāku vide.</p>
<form id="login-form" class="card" style="max-width:450px;margin:28px auto">
<h2 id="login-heading">Laipni lūgti!</h2>
<label for="login-password">Parole</label>
<div class="password-field">
<input id="login-password" name="password" type="password" minlength="6" required autocomplete="current-password" style="display:block;width:100%;padding:13px;border:1px solid #aebdd0;border-radius:10px;font:inherit;margin:10px 0">
<button id="password-toggle" class="password-toggle" type="button" aria-label="Parādīt paroli" aria-pressed="false" title="Parādīt paroli">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<p id="login-message" role="status" aria-live="polite"></p>
<button type="submit">Pieslēgties</button>

</form>
</section>
<section id="school" hidden aria-live="polite">
<span class="tag">Mājas skola</span><h1 id="school-title"></h1><p id="school-intro"></p>
<div class="modules" id="modules"></div>
<p><button class="back" id="back" type="button">← Atpakaļ uz sākumu</button></p>
</section>
<footer>Mājas skola ar Firebase integrāciju · Projekts: <code>datorika-hub</code> · Dati izolēti <code>homeSchool</code> struktūrā</footer>
</main>
<script>
(function(){
  const input=document.getElementById('login-password');
  const toggle=document.getElementById('password-toggle');
  const eye='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff='<path d="M3 3l18 18M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.2 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/>';
  toggle.addEventListener('click',function(){
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    toggle.setAttribute('aria-label',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('title',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('aria-pressed',String(visible));
    toggle.querySelector('svg').innerHTML=visible?eyeOff:eye;
    input.focus({preventScroll:true});
  });
})();
</script>
<script type="module" src="/public/bundle.js"></script>
</body></html>

<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13273e">
<title>Mājas skola</title>
<meta name="description" content="Mājas skola — Marka, Samantas un vecāku vide.">
<meta property="og:title" content="Mājas skola">
<meta property="og:description" content="Mājas skola - demonstrācijas skati: Marka skola, Samantas skola un Vecāka panelis.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap');
:root{font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#182543;background:#f5f7ff;font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 4% 3%,#e5e5ff 0,transparent 30%),radial-gradient(circle at 96% 16%,#dff9fc 0,transparent 29%),#f6f8ff;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
button:not(:disabled):hover{transform:translateY(-2px)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7b64f7;outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
[hidden]{display:none!important}
header{max-width:none;background:#fffefaeb;backdrop-filter:blur(20px);color:#24294e;border-bottom:1px solid #e8eaf7;padding:16px max(24px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:10;box-shadow:0 6px 30px #3b36850a}
header strong{font-size:1.15rem;font-weight:900;letter-spacing:-.03em}
header button,.quiet-button{background:#f2f0ff;color:#56459c;border:1px solid #e8e1ff;border-radius:14px;padding:11px 16px;font-weight:800}
#header-auth-bar{display:flex;gap:10px}
.wrap{max-width:1160px;margin:0 auto;padding:45px 24px 40px}
h1,h2,h3{font-family:'Nunito','DM Sans',sans-serif;line-height:1.2;letter-spacing:-.035em}
h1{font-size:clamp(2.4rem,5vw,4.25rem);font-weight:900;margin:12px 0 14px}
h2{font-size:clamp(1.3rem,2.2vw,1.85rem)}
h3{font-size:1.2rem}
p{line-height:1.6;color:#66708d}
.intro{max-width:680px;margin-bottom:34px;font-size:1.13rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card,.module{background:#fff;border:1px solid #e9eafa;border-radius:25px;padding:27px;box-shadow:0 15px 46px #2d297a0c}
.card h2{margin:15px 0 7px}
.symbol{font-size:45px}
.card button,.back,.action-button,.module>button:not(.quiet-button),.button-cluster button:not(.quiet-button){background:linear-gradient(135deg,#6d5af6,#4d49cf);color:white;border:0;border-radius:15px;padding:13px 22px;font-weight:800;box-shadow:0 7px 18px #6c5af637}
.card button:hover,.back:hover,.action-button:hover{box-shadow:0 10px 25px #6c5af64a}
.tag,.eyebrow{display:inline-block;border-radius:99px;background:#eeeaff;color:#6b50d0;padding:8px 14px;font-size:.78rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:30px}
.module{min-width:0}
.module p{margin-bottom:13px}
.module button{min-height:42px}
#school-title{margin-top:20px}
#school-intro{font-size:1.1rem}
#school{animation:appear .3s ease-out}
#login-form{border:1px solid #e7e3ff;box-shadow:0 30px 70px #5244aa1c!important}
#login-form>button[type=submit]{width:100%;min-height:50px;font-size:1.04rem}
#login-form label{font-weight:800;color:#343859}
.password-field{position:relative;margin:10px 0}
.password-field input{margin:0!important;padding-right:56px!important}
.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:transparent!important;color:#52637a!important;border:0!important;border-radius:9px;cursor:pointer;margin:0!important;padding:0!important;box-shadow:none!important}
.password-toggle:hover{background:#eaf1fa!important;transform:translateY(-50%)!important}
.password-toggle svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.learning-hub{padding:clamp(20px,4vw,38px);border-radius:30px;background:linear-gradient(145deg,#fff 0%,#fcfbff 100%);border:1px solid #ebe6ff;box-shadow:0 24px 65px #3d388617}
.learning-heading{padding:8px 0 23px}
.learning-heading h2{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:900;margin:16px 0 8px}
.learning-heading p{font-size:1.05rem;max-width:660px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px;margin:9px 0 28px}
.topic-tile{border:2px solid #ece9ff;background:#fff;border-radius:23px;min-height:170px;padding:25px 19px;color:#253050;text-align:left;display:flex;flex-direction:column;gap:7px;align-items:flex-start;box-shadow:0 10px 25px #6159ab10}
.topic-tile:hover{border-color:#aba0ff;background:#f8f6ff;box-shadow:0 18px 32px #6159ab22}
.topic-emoji{font-size:2.5rem;line-height:1.2}
.topic-tile strong{font-size:1.16rem;font-weight:900}
.topic-tile small{font-size:.9rem;color:#67718e}
.stat-strip{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 24px}
.stat-strip span{background:#e8fbf4;border:1px solid #c8efdf;color:#136f58;border-radius:99px;padding:10px 14px;font-size:.88rem;font-weight:800}
.settings-panel{display:flex;flex-wrap:wrap;align-items:center;gap:15px;padding:19px 23px;border:1px solid #e8e9f9;border-radius:18px;background:#f8f9ff;margin:12px 0 18px}
.settings-panel label{font-weight:800}
.select-control{border:1px solid #cad3ef;border-radius:12px;padding:13px;color:#293255;background:#fff;min-width:190px;flex:1}
.button-cluster{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.button-cluster button{margin:0!important}
.progress-track{width:100%;height:11px;border-radius:20px;background:#e9e7f9;overflow:hidden;margin:12px 0 30px}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#8a7bff,#36c7be);transition:width .35s}
.question-stage{border-radius:28px;background:#fff;border:2px solid #ebeafd;padding:clamp(22px,4vw,40px);text-align:center;box-shadow:0 20px 43px #4a469b0e}
.question-stage .eyebrow{background:#eafafa;color:#157e82}
.math-expression{font-family:'Nunito',system-ui,sans-serif;font-size:clamp(2.6rem,9vw,5.5rem);font-weight:900;color:#28366a;letter-spacing:-.045em;padding:28px 5px;line-height:1.25}
.math-answer-form{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center}
.big-number-input{width:150px!important;max-width:90%;min-height:68px;border:2px solid #d8d9f3;background:#f9faff;border-radius:18px;font-size:2rem;font-weight:900;text-align:center;color:#373285}
.math-answer-form .action-button{min-height:66px;font-size:1.03rem}
.feedback-line{font-weight:800;min-height:25px;color:#484c87}
.result-hero{font-family:'Nunito',sans-serif;font-size:clamp(4rem,10vw,7rem);font-weight:900;text-align:center;color:#594de2;background:linear-gradient(135deg,#f0eaff,#e6fffa);border-radius:30px;padding:29px;margin:18px 0}
.result-subtitle{text-align:center;font-size:1.25rem;font-weight:900;color:#303c64}
.soft-notice{border-radius:17px;background:#f0f6ff;border:1px solid #dce8ff;color:#46568f;padding:17px 20px;font-weight:700;margin:17px 0}
.table-area{border:1px solid #e8e9fa;border-radius:22px;padding:20px;margin-top:25px;background:#fff}
.times-grid{display:grid;gap:4px;max-width:510px;overflow-x:auto}
.times-line{display:grid;grid-template-columns:repeat(10,minmax(28px,1fr));gap:4px}
.times-cell{display:flex;justify-content:center;align-items:center;border-radius:8px;background:#f3f0ff;color:#5144b5;font-weight:800;aspect-ratio:1;min-width:0;font-size:clamp(.72rem,1.8vw,.98rem)}
.times-line:nth-child(2n) .times-cell{background:#eafaf8;color:#1b827c}
footer{margin:58px 0 20px;text-align:center;color:#8c96ab;font-size:.81rem}
footer code{font-size:.77rem}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:660px){header{padding:13px 17px}.wrap{padding:25px 14px}.card,.module{padding:21px;border-radius:20px}.learning-hub{padding:18px}.topic-grid{grid-template-columns:1fr 1fr;gap:10px}.topic-tile{padding:17px 12px;min-height:146px}.topic-tile strong{font-size:.98rem}.topic-tile small{font-size:.8rem}.math-answer-form{flex-direction:column}.big-number-input{width:100%!important}.math-answer-form .action-button{width:100%}.stat-strip span{font-size:.77rem}.button-cluster{flex-direction:column}.button-cluster button{width:100%}.times-line{gap:2px}.times-cell{border-radius:5px}.modules{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.latvian-hub .topic-grid{margin-bottom:26px}
.latvian-hub .topic-tile{min-height:152px}
.latvian-hub #unused{display:none}
.latvian-hub .latvian-question{background:linear-gradient(140deg,#eeebff,#f0fcfc);border:1px solid #e2dffd;border-radius:23px;padding:clamp(20px,4vw,35px);font-size:clamp(1.32rem,3vw,2rem);color:#333263;font-weight:900;margin:18px 0}
.latvian-question-form{border:1px solid #e8e8f8;border-radius:22px;background:white;padding:clamp(16px,3vw,28px);display:grid;gap:10px}
.latvian-question-form label{display:flex!important;gap:13px;align-items:center;padding:15px 17px!important;border:1.5px solid #e6e7f5;border-radius:15px;background:#fafaff;color:#323b5c;font-weight:700;cursor:pointer;min-height:54px}
.latvian-question-form label:hover{border-color:#9387ef;background:#f3f1ff}
.latvian-question-form input[type=radio],.latvian-question-form input[type=checkbox]{width:21px;height:21px;accent-color:#6656e8;flex-shrink:0}
.latvian-question-form input[type=text]{border:2px solid #d8d9f3!important;background:#fafaff;border-radius:15px!important;max-width:100%!important;min-height:58px}
.latvian-question-form>button{justify-self:start}
.latvian-hub .action-button{margin:6px 8px 6px 0;border:0;border-radius:14px;background:linear-gradient(135deg,#7463f5,#5146c5);color:#fff;padding:13px 20px;font-weight:800;box-shadow:0 7px 20px #6c5af631}
.latvian-hub [role=status]{font-weight:700}

:root{--personal-primary:#6554e8;--personal-accent:#36c5be;--personal-tint:#f0edff}
html[data-school-theme="marks"] body{background:radial-gradient(circle at 10% 12%,var(--personal-tint),transparent 42%),radial-gradient(circle at 88% 15%,#e5fffc,transparent 37%),#f7f9ff}
html[data-school-theme="samanta"] body{background:radial-gradient(circle at 9% 9%,var(--personal-tint),transparent 42%),radial-gradient(circle at 90% 17%,#fff3da,transparent 38%),#fff9fb}
html[data-school-theme] .learning-hub{border-color:color-mix(in srgb,var(--personal-primary) 25%,white);background:linear-gradient(145deg,#fff,var(--personal-tint))}
html[data-school-theme] .learning-heading .eyebrow,html[data-school-theme] .eyebrow{background:var(--personal-tint);color:var(--personal-primary)}
html[data-school-theme] .action-button,html[data-school-theme] .back{background:linear-gradient(135deg,var(--personal-primary),var(--personal-accent));color:white}
html[data-school-theme] .topic-tile:hover{border-color:var(--personal-primary);background:var(--personal-tint)}
html[data-school-theme] .progress-fill{background:linear-gradient(90deg,var(--personal-primary),var(--personal-accent))}
.theme-picker{grid-column:1/-1;border:1px solid #e9e8f6;border-radius:24px;padding:24px;background:#fff;box-shadow:0 12px 35px #352e850c}
.theme-picker>strong{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900}
.theme-picker p{margin:5px 0 17px}
.theme-variants{display:flex;gap:12px;flex-wrap:wrap}
.theme-choice{background:#fff;border:2px solid #e6e7f3;border-radius:17px;min-height:56px;padding:9px 15px;display:flex;align-items:center;gap:11px;color:#394264;font-weight:800}
.theme-choice[aria-pressed=true]{border-color:var(--personal-primary);background:var(--personal-tint);box-shadow:0 0 0 2px color-mix(in srgb,var(--personal-primary) 10%,transparent)}
.theme-swatch{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px #ffffffad}
.story-expression{font-family:'Nunito',sans-serif;font-size:clamp(1.45rem,3vw,2.1rem);font-weight:850;line-height:1.75;color:#28345d;max-width:660px;margin:18px auto 24px;letter-spacing:0;text-align:left}
.reading-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:6px auto 24px}
.reading-controls button{min-height:50px}
.visual-groups{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;max-width:760px;margin:4px auto 29px}
.visual-group{display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;background:#fff9e9;border:2px solid #f2d9aa;border-radius:17px;padding:12px;min-width:62px;max-width:200px}
.visual-object{font-size:clamp(1.2rem,2.9vw,1.8rem);line-height:1.3}
@media(max-width:660px){.theme-picker{padding:16px}.theme-variants{flex-direction:column}.theme-choice{width:100%}.visual-groups{gap:7px}.visual-group{padding:8px;min-width:48px}.story-expression{line-height:1.75}}
</style>
</head>
<body>
<header><strong>🏠 Mājas skola</strong><button id="home" type="button" hidden>← Sākums</button></header>
<main class="wrap">
<section id="welcome">
<h1>🏠 Mājas skola</h1>
<p class="intro">Ievadi savu paroli — atvērsies Marka, Samantas vai vecāku vide.</p>
<form id="login-form" class="card" style="max-width:450px;margin:28px auto">
<h2 id="login-heading">Laipni lūgti!</h2>
<label for="login-password">Parole</label>
<div class="password-field">
<input id="login-password" name="password" type="password" minlength="6" required autocomplete="current-password" style="display:block;width:100%;padding:13px;border:1px solid #aebdd0;border-radius:10px;font:inherit;margin:10px 0">
<button id="password-toggle" class="password-toggle" type="button" aria-label="Parādīt paroli" aria-pressed="false" title="Parādīt paroli">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<p id="login-message" role="status" aria-live="polite"></p>
<button type="submit">Pieslēgties</button>

</form>
</section>
<section id="school" hidden aria-live="polite">
<span class="tag">Mājas skola</span><h1 id="school-title"></h1><p id="school-intro"></p>
<div class="modules" id="modules"></div>
<p><button class="back" id="back" type="button">← Atpakaļ uz sākumu</button></p>
</section>
<footer>Mājas skola ar Firebase integrāciju · Projekts: <code>datorika-hub</code> · Dati izolēti <code>homeSchool</code> struktūrā</footer>
</main>
<script>
(function(){
  const input=document.getElementById('login-password');
  const toggle=document.getElementById('password-toggle');
  const eye='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff='<path d="M3 3l18 18M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.2 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/>';
  toggle.addEventListener('click',function(){
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    toggle.setAttribute('aria-label',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('title',visible?'Paslēpt paroli':'Parādīt paroli');
    toggle.setAttribute('aria-pressed',String(visible));
    toggle.querySelector('svg').innerHTML=visible?eyeOff:eye;
    input.focus({preventScroll:true});
  });
})();
</script>
<script type="module" src="/public/bundle.js"></script>
</body></html>
